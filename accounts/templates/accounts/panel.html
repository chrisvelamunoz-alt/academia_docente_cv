{% extends "accounts/base.html" %}

{% block title %}Panel | Academia Docente{% endblock %}

{% block content %}
<h1>Panel</h1>

<p class="usuario-activo">
    Usuario autenticado: <strong>{{ user.username }}</strong>
</p>

<form method="post" action="{% url 'accounts:logout' %}" class="formulario">
    {% csrf_token %}
    <button type="submit" class="boton">Cerrar sesión</button>
</form>
{% endblock %}
